# Two-sided pods at the mast5-spreaders positions. Each pod is a PTZ on top,
# a down-looking fisheye underneath, and between them a SOC, a 6-axis IMU and
# a PoE PD on one gigabit cable. The PTZ keeps the pod's id (so scenario aims
# still apply); the fisheye is "<id>-down" and serves the near zone (deck,
# docking, the water round the hull), not the horizon watch.
#
# pos_m is the pod centre; the kit in design/electronics.toml offsets the
# cameras above and below it.

[rig]
name = "pods5"
reserve = 1
max_group = 4

[[pod]]
id = "top"
kit = "standard"
up = "ptz_long"
down = "fisheye_down"
# On the 0.5 m forward crane, clear of the mast cap.
pos_m = [0.5, 0.0, 18.75]
face_az_deg = 0.0
on_mast = true

[[pod]]
id = "fwd"
kit = "standard"
up = "ptz_mid"
down = "fisheye_down"
pos_m = [0.30, 0.0, 13.85]
face_az_deg = 0.0
on_mast = true

[[pod]]
id = "port"
kit = "standard"
up = "ptz_mid"
down = "fisheye_down"
pos_m = [0.0, 1.0, 12.25]
face_az_deg = 90.0
on_mast = true

[[pod]]
id = "stbd"
kit = "standard"
up = "ptz_mid"
down = "fisheye_down"
pos_m = [0.0, -1.0, 12.25]
face_az_deg = -90.0
on_mast = true

# Under the gooseneck: its fisheye sees the cockpit and companionway.
[[pod]]
id = "aft"
kit = "standard"
up = "ptz_mid"
down = "fisheye_down"
pos_m = [-0.30, 0.0, 2.55]
face_az_deg = 180.0
on_mast = true
