# Reference boat: a 40 ft masthead-rig cruising sloop.
# Every number is REF (a plausible stand-in) until it is replaced by the real
# boat's measurements. Body frame: origin on the waterline directly under the
# mast, x forward, y to port, z up, metres.

[boat]
name = "REF-40 sloop"
lwl_m = 10.7
beam_m = 3.9
max_beam_x_m = -1.0        # station of maximum beam
transom_beam_frac = 0.8    # transom width as a fraction of max beam
bow_x_m = 4.6              # stem
stern_x_m = -7.6           # transom
freeboard_m = 1.2          # deck edge above the waterline
draft_m = 1.9

[mast]
deck_z_m = 1.3             # mast step at the deck
truck_z_m = 18.5           # top of the mast section
radius_m = 0.12            # section treated as a cylinder for occlusion
spreaders_z_m = [7.5, 12.5]
spreader_half_span_m = [1.35, 0.95]

[sailplan]
type = "masthead"
boom_z_m = 3.1             # gooseneck
boom_length_m = 5.2        # E
main_head_z_m = 17.6
forestay_tack_x_m = 4.4    # J, from the mast
forestay_head_z_m = 18.0
jib_clew_aft_m = 1.2       # clew aft of the mast (a 105 % jib)
jib_clew_z_m = 2.0
main_sheet_deg = 15        # boom off the centreline, to leeward
jib_sheet_deg = 12

[motion]
# Linear responses to the wave spectrum (motion.py). Natural periods and
# damping are REF values for a boat of this size; the Bosun's Chair pod
# (Phase 0) is how to replace them with measured spectra.
roll_period_s = 4.5
pitch_period_s = 3.2
heave_period_s = 3.0
roll_damping_motoring = 0.08
roll_damping_sailing = 0.30  # sails damp roll hard
pitch_damping = 0.30
heave_damping = 0.40
wave_slope_factor = 0.7      # effective wave slope coefficient (hull is not a raft)
yaw_wander_deg = 2.0         # helm/autopilot wander
yaw_wander_period_s = 20.0
rig_mode_hz = 2.4            # first fore-aft mast bending mode
rig_mode_tip_deg = 0.05      # tip slope at Hs = 2 m (~1.6 cm at the truck); scales with Hs, capped at 2 m
