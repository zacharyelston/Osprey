# The boat cannot turn back: it keeps sailing (a delivery passage in company,
# say, with another boat standing by the datum), so Recon has to chase it home
# upwind. The geometry that made the first offshore sizing too optimistic.

[mission]
name = "sar-convoy"
label = "Search 5 km astern while the boat sails on, sea state 3, 15 kn wind"
sea_state = "ss3"
visibility_km = 10.0
target = "person_in_water"
boat_speed_kn = 6.0
boat_mode = "sail"         # after launch: "return" to the datum and heave to, or "sail" on
boat_heading_deg = 30.0
datum_range_m = 5000.0
datum_bearing_deg = 210.0
datum_sigma_m = 200.0
drift_ms = [0.25, 0.15]
wind_from_deg = 60.0
wind_kn = 15.0
cruise_alt_m = 100.0
search_alt_m = 100.0             # 120 m is the usual drone ceiling
search_pod = 0.90
search_time_max_s = 2400.0
reserve_frac = 0.20
recovery_radius_m = 30.0
