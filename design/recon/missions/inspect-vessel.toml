# Who is that? A vessel 5 km off on a crossing course: fly out, orbit it at a
# respectful standoff zoomed in to identify it, and come home while the boat
# sails on.

[mission]
kind = "inspect"
name = "inspect-vessel"
label = "Identify a vessel 5 km off on a crossing course, from a 200 m standoff"
sea_state = "ss3"
visibility_km = 12.0
boat_speed_kn = 6.5
boat_mode = "sail"
boat_heading_deg = 0.0
vessel_range_m = 5000.0
vessel_bearing_deg = 300.0
vessel_course_deg = 120.0
vessel_speed_kn = 8.0
vessel_class = "sailboat_30ft"
need = "identify"
standoff_m = 200.0
inspect_alt_m = 60.0
laps = 2
dwell_s = 30.0             # with fixed cameras: seconds in view at identify resolution
wind_from_deg = 90.0
wind_kn = 15.0
cruise_alt_m = 100.0
task_time_max_s = 1200.0
reserve_frac = 0.20
recovery_radius_m = 30.0
