# Recon as a Cyclone: three arms that are wings, after Nick Rehm's Cyclone-Rotor
# tricopter. Built from the twin-boom one-bird: each arm is one of its wing halves,
# plus a third. All values REF: stand-ins until a model is built and measured.
#
# Actuators: A, the motors at the arm tips; A2, optional motors mid-way along each
# arm; B, the blade servos that twist each arm about its own axis (and the motors
# on it with it). The modes, run by recon/cyclone_modes.py:
#   1  lift-off and landing: B centred, A (and A2) pushing up, the first 25 ft;
#   2  spinning hover: B pitches the arms off centre, left or right; A pushes round
#      and the whole bird spins, a spinning prop;
#   3  spinning travel: the spinning disc tilted to go somewhere;
#   4  wing-borne travel: mode 1 turned horizontal, B forward, the two upper arms
#      the dihedral wing, the third the fin, A pushing forward.

[cyclone]
arms = 3
hub_radius_m = 0.08          # pod, bearings and the B servos
hub_kg = 0.35                # replaces the twin-boom's 0.45 kg pod, booms, tail and servos
hub_cda_m2 = 0.008           # the pod and gimbal, no booms or tail

# Mode 2 and 3, spinning: the arms are rotor blades.
cl_mean = 0.55               # mean blade lift coefficient in the hover, under a symmetric section's stall
cd_section = 0.018           # symmetric section at Re 100-200k
induced_factor = 1.15        # momentum theory's induced power, times this for tip loss and uneven inflow
tip_prop_efficiency = 0.60   # A pushing the arms round at the tip speed
nacelle_cda_m2 = 0.0008      # each A nacelle, whirled round at the tip speed
thrust_to_weight = 1.6       # peak spinning thrust, as the tailsitter's
mu_max = 0.35                # advance ratio (airspeed / tip speed) past which the retreating arm stalls
autorotation_cd = 1.2        # drag coefficient on the disc, A off, spinning down like a seed
splash_stop_m = 0.10         # how far the hub and arms sink stopping on the water

# Mode 1, B centred: A pushing up, as a tricopter.
tri_prop_diameter_m = 0.25   # A's props
tri_figure_of_merit = 0.60
tri_thrust_to_weight = 1.3   # mode 1's peak: the weight, the climb, and the water's grip as it lets go
burst_factor = 1.5           # A can run at this times its rating for a mode-1 stint, if it is short enough
tri_cda_m2 = 0.030           # hub plus three arms at odd angles to the flow
specific_kg_per_kw = 0.22    # motor, ESC and prop per kW of rated shaft power (the tailsitter's)
fixed_kg = 0.06              # mounts and wiring for the three A motors

# Mode 4: B forward, so the old spin axis points along the flight path. The three arms stand
# in the plane across it: two up at the dihedral as the wing, one straight down as the fin.
# A pushes forward; A's PWM is the fine control, B the large corrections. Spinning, the three
# blades all have the same handedness; flying, the two wings must be mirror images. Twisting
# an arm about its own axis can't turn one into the other, so the sections are symmetric and
# each B servo sets its arm's angle of attack.
dihedral_deg = 30.0          # the wings, with the arms 120 degrees apart and the fin straight down
cl_max = 0.90                # symmetric section, against the cambered wing's 1.2 (each wing's own)
cd_symmetric_extra = 0.004   # profile drag over the cambered section at the cruise lift
k_factor = 1.05              # induced drag over a flat wing of the projected span: the fin and the hub

exposure_ms = 1.0            # the camera's, for the smear while spinning

[modes]
clearance_m = 7.6            # 25 ft: mode 1 climbs this far clear of the deck, the water and anything near
climb1_ms = 1.5              # mode 1 climb
descent1_ms = 1.0            # mode 1 descent to touchdown
b_ramp_s = 3.0               # 1->2 and 2->1: B from centre to the spin setting, or back; A holds the height
burst_s_max = 20.0           # longest stint A can run over its rating
climb2_ms = 2.0              # mode 2 climb
descent2_ms = 2.0            # mode 2 powered descent
tilt_deg = 10.0              # 2->3 and 3->2: the disc tilted to speed up or slow down
profile_k = 4.65             # mode 3: the arms' drag grows as 1 + K mu^2 with the advance ratio
pitch_rate_dps = 30.0        # 3->4: from B centred (A up) over to level; 4->1: back up to A up
safety_height_m = 10.0       # the lowest point of any move above the water
zoom_efficiency = 0.8        # 4->3: of the kinetic energy that comes back as height in the pull-up
entry_s = 2.0                # 4->3: the inflow spinning the arms up, sinking at the autorotation rate

# A2: optional motors mid-way along each arm, the same props as A, pushing in modes 1 and 4 and in
# the moves between them, folded while it spins. The report shows both; this picks the one sized.
a2 = false
a2_station = 0.5             # along the arm, from the hub
a2_fixed_kg = 0.05           # their mounts and wiring
