# Airframe variant: the loiter craft as a tandem tilt-body, flown like the
# Opener BlackFly. Staggered wings, the front low and the rear high and well
# aft, fixed to a slim pod that holds the battery and the gimbal; four props
# on each wing's leading edge blow over it. It lifts off by pitching the
# whole craft up so the props carry it, and pitches over to fly on the
# wings: no tilt mechanism, no take-off run, no tail. In cruise two props
# pull and the other six fold. Each motor nacelle runs aft under its wing
# into a streamlined float, so the eight nacelles are its fairings and its
# floats at once.
# Overlaid on design/recon/airframe.toml with `--airframe tandem`; sized for
# hours on station by `osprey recon-loiter` (design/recon/loiter.toml).
#
# Two lifting surfaces are sized together in OpenAeroStruct, each with its own
# spar; the CG sits between them, trimmed and with a static margin.

[layout]
kind = "tandem"
vtol = "tiltbody"
label = "Tandem tilt-body: staggered wings, four props on each, nacelles that are floats; lifts off on its props"

[wing]                     # the front wing
num_y = 11
num_x = 2
span_m = 3.0
cd0_extra = 0.003          # moulded finish, no panel joints
root_chord_m = 0.22
span_bounds_m = [2.0, 4.0]                # stows in panels to 4 m, as the lifting body; 2 m fits four props beside the pod
chord_scale_bounds = [0.4, 1.6]

[rear]                     # the rear wing, x_m behind the front and z_m above it
span_m = 3.0
root_chord_m = 0.22
t_over_c = 0.12
span_bounds_m = [2.0, 4.0]
chord_scale_bounds = [0.4, 1.6]
x_m = 1.00
z_m = 0.30                 # the gap: the rear wing out of the front's wake, and the tandem's induced drag down

[manufacture]
method = "molded"          # moulded composite wings and pod, as the lifting body: no printer-bed limit on chord

[skin]
areal_kg_m2 = 0.35         # moulded glass/carbon skin over ribs, per wetted m², as the blended wing's
rib_fraction = 0.25

[stability]
static_margin_min = 0.10   # of the front wing's mean chord
cg_x_bounds_m = [0.30, 0.50]   # aft of the front wing's leading edge: the hover balance. The prop rows sit
                               # 0.1 m ahead of each wing, 1.0 m apart; here they share the weight no worse
                               # than 60/40. Left free, the optimizer moves the CG onto the front wing and
                               # shrinks the rear to a tailplane, which can't hover.
probe_alpha_deg = 1.0

[spar]
radius_bounds_m = [0.004, 0.020]

[fuselage]                 # a slim pod for the battery, avionics and gimbal: the floats are on the nacelles
length_m = 1.20
diameter_m = 0.20
nose_x_m = 0.35            # ahead of the front wing's leading edge
axis_z_m = 0.06            # the pod's axis above the front wing's plane: a low front wing; the rear sits on a fin

[body]
mass_kg = 0.60             # the moulded pod and its hatch, four elevon servos, the rear wing's fin, wiring
cda_m2 = 0.0066            # the pod and gimbal 0.005, and eight motor nacelles at 0.0002; the floats are added

[nacelle_floats]           # each motor nacelle runs aft under its wing into a streamlined float on a short pylon
count = 8
reserve = 2.0              # the floats alone carry this x the craft's weight, sealed
fineness = 7.0             # length / diameter
areal_kg_m2 = 0.35         # moulded skin, per wetted m²
fittings_kg = 0.015        # each: pylon, seals, drain plug
drop_m = 0.23              # every float's axis this far below the front wing's plane: the front props' tips
                           # clear the calm water afloat; the rear wing's floats hang on longer pylons, level with them
cf = 0.0055                # turbulent skin friction at a 0.5-0.8 m float's Reynolds number
pylon_cda_m2 = 0.0003      # each

[avionics]
mass_kg = 0.30             # autopilot, GNSS, a long-range radio and video link
power_w = 10.0

[hover]
props = 8
prop_diameter_m = 0.30
figure_of_merit = 0.65
thrust_to_weight = 1.5     # peak: control in gusts, and the climb off the water
specific_kg_per_kw = 0.22  # motor, ESC and folding prop per kW of peak shaft power
fixed_kg = 0.12            # mounts and wiring for eight motors
time_s = 60.0              # hover per sortie: the lift-off and pitch-over, and the landing
prop_y_frac = [0.15, 0.38] # each wing's two props a side, at these fractions of its span from the centreline

[propulsion]
battery_kg = 3.0
battery_bounds_kg = [0.3, 10.0]
prop_efficiency = 0.62     # two hover props pulling at a few per cent of their thrust
mass_guess_kg = 6.0

[limits]
stall_speed_max_ms = 15.0  # it lands on its props: no net or water landing to protect
search_speed_bounds_ms = [8.0, 30.0]
search_speed_init_ms = 13.0
tip_bend_max = 0.10         # the tip's rise at the 3 g manoeuvre, of the semi-span
manoeuvre_speed_ms = 21.0  # V_A: the 3 g manoeuvre and gusts here, about sqrt(3) x a 12 m/s stall,
                           # not at the loiter speed, where it would stall first
